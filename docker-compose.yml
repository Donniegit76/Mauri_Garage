services:
  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      APP_PASSWORD: ${APP_PASSWORD:-}
      APP_SECRET: ${APP_SECRET:-change-me-in-.env}
    expose:
      - "8000"
    volumes:
      - app_data:/data

  frontend:
    build: ./frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${PORT:-8080}:80"

volumes:
  app_data:
