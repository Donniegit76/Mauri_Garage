name: Build and publish Docker images

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Read app version
        id: version
        run: echo "version=$(jq -r .version frontend/package.json)" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mauri-garage-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mauri-garage-backend:v${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mauri-garage-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mauri-garage-frontend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mauri-garage-frontend:v${{ steps.version.outputs.version }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mauri-garage-frontend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
